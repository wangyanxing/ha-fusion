services:
  ha-fusion:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    volumes:
      - ha-fusion-data:/app/data
    ports:
      - '${EXPOSED_PORT:-5050}:5050'
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HASS_URL: ${HASS_URL:?请设置平板和容器均可访问的 HA 地址}
      IMMICH_URL: ${IMMICH_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      IMMICH_ALBUM_ID: ${IMMICH_ALBUM_ID:-}
      ORIGIN: ${ORIGIN:-}
      PORT: 5050
      NODE_ENV: production
      ADDON: 'false'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:5050").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ha-fusion-data:
